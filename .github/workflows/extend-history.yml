name: Extend historical statistics to all available years
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/extend-history.py', 'scripts/history_payouts.py', '.github/workflows/extend-history.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: betkj3-history-expansion
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ['2021', '2022', '2023', '2024', '2025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kkongt2/timeline
          ref: main
          path: _seed
          sparse-checkout: |
            training
            scripts/model-research
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 charset-normalizer
      - uses: actions/cache@v4
        with:
          path: training/raw
          key: betkj3-reports-${{ matrix.year }}-v1
      - name: Recover official historical payouts
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/extend-history.py --year ${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.year }}
          path: |
            history/${{ matrix.year }}.jsonl.gz
            history/${{ matrix.year }}-coverage.json
          retention-days: 3
  preserve:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: history
          merge-multiple: true
      - name: Preserve complete historical source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history
          if ! git diff --cached --quiet; then
            git commit -m 'Extend historical statistics source data back to January 2021'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  publish:
    needs: preserve
    uses: ./.github/workflows/publish.yml
