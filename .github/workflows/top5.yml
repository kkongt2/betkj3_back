name: Build Seoul preset 1
on:
  push:
    branches: ['feature/seoul-balanced']
    paths: ['scripts/**', 'tests/**', '.github/workflows/top5.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seoul-top5
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate balance rules and exact evaluation
        run: |
          node --check scripts/top5-presets.cjs
          node tests/seoul.cjs
          g++ -O3 -fopenmp -std=c++17 scripts/search-top5.cpp -o /tmp/search-top5
          node tests/weight-balance.cjs
      - name: Search and verify analysis-only preset 1
        run: |
          node scripts/top5-presets.cjs
          node tests/top5.cjs
          node tests/diversity.cjs
          node tests/site.cjs
      - name: Preserve verified presets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add top5-presets.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record analysis-only preset 1'
            git pull --rebase origin feature/seoul-balanced
            git push origin HEAD:feature/seoul-balanced
          fi
